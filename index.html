<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobile Remote Receiver</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #222; width: 100%; height: 100%; }
        video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
    </style>
</head>
<body>

    <video id="remoteVideo" autoplay playsinline muted></video>

    <script>
        const video = document.getElementById('remoteVideo');
        const pc = new RTCPeerConnection({
            iceServers: [{ urls: 'stun:://google.com' }]
        });
        
        pc.addTransceiver('video', { direction: 'recvonly' });
        const dataChannel = pc.createDataChannel("inputs", { ordered: true });

        pc.ontrack = (event) => {
            if (event.streams && event.streams[0]) {
                video.srcObject = event.streams[0];
            } else {
                const inboundStream = new MediaStream();
                inboundStream.addTrack(event.track);
                video.srcObject = inboundStream;
            }
            video.play().catch(e => console.log("Waiting for user touch gesture to unblock video stream..."));
        };

        // Standardized event execution logic wrapper
        function processTouch(e, type) {
            e.preventDefault();
            if (video.paused) video.play().catch(() => {});
            
            if (!dataChannel || dataChannel.readyState !== "open") return;

            const touch = e.touches[0];
            if (!touch && type === "mousemove") return;

            const rect = video.getBoundingClientRect();
            const clientX = touch ? touch.clientX : e.changedTouches[0].clientX;
            const clientY = touch ? touch.clientY : e.changedTouches[0].clientY;

            const relativeX = (clientX - rect.left) / rect.width;
            const relativeY = (clientY - rect.top) / rect.height;

            if (relativeX >= 0 && relativeX <= 1 && relativeY >= 0 && relativeY <= 1) {
                if (type === "mousemove") {
                    dataChannel.send(JSON.stringify({ type: "mousemove", x: relativeX, y: relativeY }));
                } else if (type === "click") {
                    dataChannel.send(JSON.stringify({ type: "click" }));
                }
            }
        }

        window.addEventListener('touchmove', (e) => processTouch(e, "mousemove"), { passive: false });
        window.addEventListener('touchend', (e) => {
            if (e.changedTouches.length === 1) processTouch(e, "click");
        }, { passive: false });

        async function start() {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            const response = await fetch('/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
            });

            const answer = await response.json();
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }

        start();
    </script>
</body>
</html>
