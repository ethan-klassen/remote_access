<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Remote PC</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    user-select: none;
    -webkit-user-select: none;
}

#container {
    position: relative;
    width: 100%;
    height: 100%;
}

video {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

audio {
    display:none;
}

#fullscreenBtn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 100;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}
</style>

</head>
<body>

<div id="container">
    <button id="fullscreenBtn">Go Fullscreen</button>
    <video
        id="remoteVideo"
        autoplay
        playsinline
        muted>
    </video>
</div>

<audio
    id="remoteAudio"
    autoplay
    playsinline>
</audio>

<script>

const video = document.getElementById("remoteVideo");
const audio = document.getElementById("remoteAudio");
const container = document.getElementById("container");
const fullscreenBtn = document.getElementById("fullscreenBtn");

const pc = new RTCPeerConnection({ iceServers:[] });
const dataChannel = pc.createDataChannel("inputs", { ordered:true });

pc.addTransceiver("video", { direction:"recvonly" });
pc.addTransceiver("audio", { direction:"recvonly" });

pc.ontrack = (event) => {
    if (event.track.kind === "video") {
        if (event.streams && event.streams[0]) {
            video.srcObject = event.streams[0];
        } else {
            const stream = new MediaStream();
            stream.addTrack(event.track);
            video.srcObject = stream;
        }
    }
    if (event.track.kind === "audio") {
        const stream = new MediaStream();
        stream.addTrack(event.track);
        audio.srcObject = stream;
        audio.muted = false;
        audio.volume = 1.0;
        audio.play().catch(() => {});
    }
};

// Fullscreen Request API Integration
fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
            console.log("Error enabling fullscreen:", err);
        });
        fullscreenBtn.innerText = "Exit Fullscreen";
    } else {
        document.exitFullscreen();
        fullscreenBtn.innerText = "Go Fullscreen";
    }
});

let activeMode = "none"; 
let initialTouchY2 = 0; 

// Letterbox Calibration Function: Computes exact inner dimensions of 16:9 frame
function getNormalizedCoords(touch) {
    const rect = video.getBoundingClientRect();
    
    // Video aspect metadata (fallback to 16:9 standard if metadata isn't ready)
    const videoWidth = video.videoWidth || 16;
    const videoHeight = video.videoHeight || 9;
    const videoRatio = videoWidth / videoHeight;
    const containerRatio = rect.width / rect.height;
    
    let actualWidth = rect.width;
    let actualHeight = rect.height;
    let letterboxLeft = 0;
    let letterboxTop = 0;
    
    // Check if black bars are on the sides or the top/bottom
    if (containerRatio > videoRatio) {
        // Black bars on left and right
        actualWidth = rect.height * videoRatio;
        letterboxLeft = (rect.width - actualWidth) / 2;
    } else {
        // Black bars on top and bottom
        actualHeight = rect.width / videoRatio;
        letterboxTop = (rect.height - actualHeight) / 2;
    }
    
    // Calculate precise touch coordinates relative ONLY to the active video frame
    let touchX = touch.clientX - rect.left - letterboxLeft;
    let touchY = touch.clientY - rect.top - letterboxTop;
    
    let normX = touchX / actualWidth;
    let normY = touchY / actualHeight;
    
    // Clamp values firmly between 0.0 and 1.0 to let inputs scrape absolute edges
    return {
        x: Math.max(0, Math.min(1, normX)),
        y: Math.max(0, Math.min(1, normY))
    };
}

function sendInput(payload) {
    if (dataChannel && dataChannel.readyState === "open") {
        dataChannel.send(JSON.stringify(payload));
    }
}

video.addEventListener("touchstart", (e) => {
    e.preventDefault();
    
    audio.muted = false;
    audio.volume = 1.0;
    audio.play().catch(() => {});

    const count = e.touches.length;

    if (count === 1) {
        activeMode = "drag1";
        const coords = getNormalizedCoords(e.touches[0]);
        sendInput({ type: "mousestart", button: 0, x: coords.x, y: coords.y });
    } 
    else if (count === 2) {
        activeMode = "scroll2";
        sendInput({ type: "mouseend", button: 0 });
        initialTouchY2 = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    } 
    else if (count === 3) {
        activeMode = "drag3";
        sendInput({ type: "mouseend", button: 0 });
        const coords = getNormalizedCoords(e.touches[0]);
        sendInput({ type: "mousestart", button: 2, x: coords.x, y: coords.y });
    }
}, { passive: false });

video.addEventListener("touchmove", (e) => {
    e.preventDefault();

    if (activeMode === "drag1") {
        const coords = getNormalizedCoords(e.touches[0]);
        sendInput({ type: "mousemove", x: coords.x, y: coords.y });
    } 
    else if (activeMode === "scroll2" && e.touches.length >= 2) {
        const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const deltaY = currentY - initialTouchY2;

        if (Math.abs(deltaY) > 20) { 
            const steps = deltaY > 0 ? -1 : 1; 
            sendInput({ type: "scroll", steps: steps });
            initialTouchY2 = currentY; 
        }
    } 
    else if (activeMode === "drag3" && e.touches.length >= 3) {
        const coords = getNormalizedCoords(e.touches[0]);
        sendInput({ type: "mousemove", x: coords.x, y: coords.y });
    }
}, { passive: false });

video.addEventListener("touchend", (e) => {
    e.preventDefault();

    if (activeMode === "drag1") {
        sendInput({ type: "mouseend", button: 0 });
    } 
    else if (activeMode === "drag3") {
        sendInput({ type: "mouseend", button: 2 });
    }
    activeMode = "none";
}, { passive: false });

async function start() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const response = await fetch("/offer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
    });

    const answer = await response.json();
    await pc.setRemoteDescription(new RTCSessionDescription(answer));
}

start();
</script>
</body>
</html>
