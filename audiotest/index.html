<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PC Audio Stream</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; background: #f0f0f0; }
        button { padding: 15px 30px; font-size: 18px; cursor: pointer; border-radius: 5px; background: #007bff; color: white; border: none; }
        audio { display: block; margin: 20px auto; width: 80%; max-width: 400px; }
    </style>
</head>
<body>

    <h2>PC System Audio Receiver</h2>
    <button id="startBtn">Connect & Listen</button>
    <audio id="remoteAudio" autoplay playsinline muted controls></audio>

    <script>
        const pc = new RTCPeerConnection();

        pc.ontrack = (event) => {
            if (event.track.kind === 'audio') {
                const audioElement = document.getElementById('remoteAudio');
                
                // Fixed: Explicitly build a local stream wrapper for Android Chrome 
                // because aiortc transmits the track ungrouped.
                const stream = new MediaStream();
                stream.addTrack(event.track);
                audioElement.srcObject = stream;
                
                // Force an initial unmute cycle when the track activates
                audioElement.muted = false;
                audioElement.volume = 1.0;
                audioElement.play().catch(e => console.log("Autoplay blocked, waiting for click.", e));
            }
        };

        async function startStream() {
            pc.addTransceiver('audio', { direction: 'recvonly' });

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);

            const response = await fetch('/offer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
            });

            const answer = await response.json();
            await pc.setRemoteDescription(new RTCSessionDescription(answer));
        }

        document.getElementById('startBtn').addEventListener('click', () => {
            startStream();
            document.getElementById('startBtn').innerText = "Streaming...";
        });

        // Safe background interaction listener for Android Chrome volume focus
        const unlockAudio = () => {
            const audio = document.getElementById('remoteAudio');
            if (audio && audio.srcObject) {
                audio.muted = false; 
                audio.volume = 1.0;
                audio.play()
                    .then(() => {
                        document.getElementById('startBtn').innerText = "Playing Live Audio";
                    })
                    .catch(err => console.log("Interaction bypass failed:", err));
            }
        };

        document.body.addEventListener('touchstart', unlockAudio, { once: false });
        document.body.addEventListener('click', unlockAudio, { once: false });
    </script>
</body>
</html>
