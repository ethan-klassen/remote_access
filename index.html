<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Remote PC</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    user-select: none;
    -webkit-user-select: none;
}

#container {
    position: relative;
    width: 100%;
    height: 100%;
}

video {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

audio {
    display:none;
}

#fullscreenBtn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255, 255, 255, 0.2);
    color: white;
    border: 1px solid rgba(255, 255, 255, 0.4);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 100;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

/* Side Control Panels Overlay Layout */
.control-panel {
    position: absolute;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 110;
}

#leftPanel { left: 20px; }
#rightPanel { right: 20px; }

.btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.game-btn {
    width: 55px;
    height: 55px;
    background: rgba(0, 0, 0, 0.6);
    color: white;
    border: 2px solid rgba(255, 255, 255, 0.4);
    border-radius: 12px;
    font-family: sans-serif;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(5px);
    -webkit-backdrop-filter: blur(5px);
}

.game-btn:active {
    background: rgba(0, 255, 200, 0.4);
    border-color: #00ffcc;
}

#keyboardInput {
    position: absolute;
    top: -100px;
    left: -100px;
    opacity: 0;
    z-index: -1;
}
</style>

</head>
<body>

<div id="container">
    <input type="text" id="keyboardInput" autocomplete="off" autocapitalize="off">
    <button id="fullscreenBtn">Go Fullscreen</button>

    <!-- Left Panel: Camera Movement Control Keys -->
    <div id="leftPanel" class="control-panel">
        <div class="btn-row">
            <button class="game-btn" data-key="up">▲</button>
        </div>
        <div class="btn-row">
            <button class="game-btn" data-key="left">◀</button>
            <button class="game-btn" data-key="down">▼</button>
            <button class="game-btn" data-key="right">▶</button>
        </div>
    </div>

    <!-- Right Panel: Camera Modification (Rotations, Zooms, Keyboard Toggle) -->
    <div id="rightPanel" class="control-panel">
        <div class="btn-row">
            <button class="game-btn" data-key="zoomin">Z +</button>
            <button class="game-btn" id="kbToggleBtn">Keyb</button>
            <button class="game-btn" data-key="zoomout">Z -</button>
        </div>
        <div class="btn-row">
            <button class="game-btn" data-key="rotleft">◀ Rot</button>
            <button class="game-btn" data-key="rotright">Rot ▶</button>
        </div>
    </div>

    <video
        id="remoteVideo"
        autoplay
        playsinline
        muted>
    </video>
</div>

<audio
    id="remoteAudio"
    autoplay
    playsinline>
</audio>

<script>

const video = document.getElementById("remoteVideo");
const audio = document.getElementById("remoteAudio");
const container = document.getElementById("container");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const kbToggleBtn = document.getElementById("kbToggleBtn");
const keyboardInput = document.getElementById("keyboardInput");

const pc = new RTCPeerConnection({ iceServers:[] });
const dataChannel = pc.createDataChannel("inputs", { ordered:true });

pc.addTransceiver("video", { direction:"recvonly" });
pc.addTransceiver("audio", { direction:"recvonly" });

// YOUR WORKING STREAM PARSER - WITH SAFE AUDIO TRACK EXTRACTION
pc.ontrack = (event) => {
    if (event.track.kind === "video") {
        // Keeps your exact fallback video assignment method that works well
        if (event.streams && event.streams.length > 0) {
            video.srcObject = event.streams.at(0);
        } else {
            const stream = new MediaStream();
            stream.addTrack(event.track);
            video.srcObject = stream;
        }
    }
    if (event.track.kind === "audio") {
        // FIXED AUDIO ROUTING: Maps the single audio track directly to prevent bracket stripping corruption
        const audioStream = new MediaStream();
        audioStream.addTrack(event.track);
        audio.srcObject = audioStream;
        audio.muted = false;
        audio.volume = 1.0;
        audio.play().catch(e => console.log("Audio waiting for touch event:", e));
    }
};

// Fullscreen Request API Integration
fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
            console.log("Error enabling fullscreen:", err);
        });
        fullscreenBtn.innerText = "Exit Fullscreen";
    } else {
        document.exitFullscreen();
        fullscreenBtn.innerText = "Go Fullscreen";
    }
});

// Accurate Screen coordinate normalization math
function getNormalizedCoords(touch) {
    const rect = video.getBoundingClientRect();
    const videoWidth = video.videoWidth || 16;
    const videoHeight = video.videoHeight || 9;
    const videoRatio = videoWidth / videoHeight;
    const containerRatio = rect.width / rect.height;
    
    let actualWidth = rect.width;
    let actualHeight = rect.height;
    let letterboxLeft = 0;
    let letterboxTop = 0;
    
    if (containerRatio > videoRatio) {
        actualWidth = rect.height * videoRatio;
        letterboxLeft = (rect.width - actualWidth) / 2;
    } else {
        actualHeight = rect.width / videoRatio;
        letterboxTop = (rect.height - actualHeight) / 2;
    }
    
    let touchX = touch.clientX - rect.left - letterboxLeft;
    let touchY = touch.clientY - rect.top - letterboxTop;
    
    return {
        x: Math.max(0, Math.min(1, touchX / actualWidth)),
        y: Math.max(0, Math.min(1, touchY / actualHeight))
    };
}

function sendInput(payload) {
    if (dataChannel && dataChannel.readyState === "open") {
        dataChannel.send(JSON.stringify(payload));
    }
}

let activeMode = "none"; 
let initialTouchY2 = 0; 

video.addEventListener("touchstart", (e) => {
    e.preventDefault();
    
    // FIXED USER INTERACTION ANCHOR: Unlocks the hardware audio driver on your first tap
    if (audio.srcObject) {
        audio.muted = false;
        audio.play().catch(() => {});
    }

    const count = e.touches.length;

    if (count === 1) {
        activeMode = "drag1";
        const coords = getNormalizedCoords(e.touches.item(0));
        sendInput({ type: "mousestart", button: 0, x: coords.x, y: coords.y });
    } 
    else if (count === 2) {
        activeMode = "scroll2";
        sendInput({ type: "mouseend", button: 0 });
        initialTouchY2 = (e.touches.item(0).clientY + e.touches.item(1).clientY) / 2;
    }
}, { passive: false });

video.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (activeMode === "drag1") {
        const coords = getNormalizedCoords(e.touches.item(0));
        sendInput({ type: "mousemove", x: coords.x, y: coords.y });
    } 
    else if (activeMode === "scroll2" && e.touches.length >= 2) {
        const currentY = (e.touches.item(0).clientY + e.touches.item(1).clientY) / 2;
        const deltaY = currentY - initialTouchY2;
        if (Math.abs(deltaY) > 20) { 
            const steps = deltaY > 0 ? -1 : 1; 
            sendInput({ type: "scroll", steps: steps });
            initialTouchY2 = currentY; 
        }
    }
}, { passive: false });

video.addEventListener("touchend", (e) => {
    e.preventDefault();
    if (activeMode === "drag1") {
        sendInput({ type: "mouseend", button: 0 });
    }
    activeMode = "none";
}, { passive: false });

// Control Panel Button Listeners
document.querySelectorAll(".game-btn[data-key]").forEach(btn => {
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        e.stopPropagation(); 
        
        // Secondary audio device unlock trigger
        if (audio.srcObject) audio.play().catch(() => {});

        sendInput({ type: "btnstart", key: btn.getAttribute("data-key") });
    });
    btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        e.stopPropagation();
        sendInput({ type: "btnend", key: btn.getAttribute("data-key") });
    });
});

// Focus Mobile keyboard
kbToggleBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    e.stopPropagation();
    keyboardInput.focus();
});

keyboardInput.addEventListener("input", (e) => {
    if (e.data) {
        sendInput({ type: "keyboard", text: e.data });
    } else if (e.inputType === "deleteContentBackward") {
        sendInput({ type: "keyboard", text: "backspace" });
    }
    keyboardInput.value = ""; 
});

async function start() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const response = await fetch("/offer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
    });

    const answer = await response.json();
    await pc.setRemoteDescription(new RTCSessionDescription(answer));
}

start();
</script>
</body>
</html>
