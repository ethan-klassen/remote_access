<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no,
               viewport-fit=cover">

<title>Remote PC</title>

<style>
html, body {
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:black;
    user-select: none;
    -webkit-user-select: none;
}

#container {
    position: relative;
    width: 100%;
    height: 100%;
}

video {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
}

audio {
    display:none;
}

#fullscreenBtn {
    position: absolute;
    top: 15px;
    right: 15px;
    background: rgba(255, 255, 255, 0.15);
    color: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 8px 14px;
    border-radius: 6px;
    font-family: sans-serif;
    font-size: 14px;
    z-index: 100;
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
}

/* Side Control Panels Overlay Layout */
.control-panel {
    position: absolute;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    z-index: 110;
}

#leftPanel { left: 20px; }
#rightPanel { right: 20px; }

.btn-row {
    display: flex;
    gap: 8px;
    justify-content: center;
}

.game-btn {
    width: 55px;
    height: 55px;
    background: rgba(0, 0, 0, 0.25);
    color: rgba(255, 255, 255, 0.5);
    border: 2px solid rgba(255, 255, 255, 0.2);
    border-radius: 12px;
    font-family: sans-serif;
    font-size: 14px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
    -webkit-backdrop-filter: blur(2px);
}

.game-btn:active {
    background: rgba(0, 255, 200, 0.4);
    border-color: #00ffcc;
    color: #ffffff;
}

#keyboardInput {
    position: absolute;
    top: -100px;
    left: -100px;
    opacity: 0;
    z-index: -1;
}
</style>

</head>
<body>

<div id="container">
    <input type="text" id="keyboardInput" autocomplete="off" autocapitalize="off">
    <button id="fullscreenBtn">Go Fullscreen</button>

    <!-- Left Panel: Camera Movement Control Keys -->
    <div id="leftPanel" class="control-panel">
        <div class="btn-row">
            <button class="game-btn" data-key="up">▲</button>
        </div>
        <div class="btn-row">
            <button class="game-btn" data-key="left">◀</button>
            <button class="game-btn" data-key="down">▼</button>
            <button class="game-btn" data-key="right">▶</button>
        </div>
    </div>

    <!-- Right Panel: Camera Modification (Rotations, Zooms, Keyboard Toggle) -->
    <div id="rightPanel" class="control-panel">
        <div class="btn-row">
            <button class="game-btn" data-key="zoomin">Z +</button>
            <button class="game-btn" id="kbToggleBtn">Keyb</button>
            <button class="game-btn" data-key="zoomout">Z -</button>
        </div>
        <div class="btn-row">
            <button class="game-btn" data-key="rotleft">◀ Rot</button>
            <button class="game-btn" data-key="rotright">Rot ▶</button>
        </div>
    </div>

    <video id="remoteVideo" autoplay playsinline muted></video>
</div>

<audio id="remoteAudio" autoplay playsinline></audio>

<script>
const video = document.getElementById("remoteVideo");
const audio = document.getElementById("remoteAudio");
const container = document.getElementById("container");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const kbToggleBtn = document.getElementById("kbToggleBtn");
const keyboardInput = document.getElementById("keyboardInput");

const pc = new RTCPeerConnection({ iceServers:[] });
const dataChannel = pc.createDataChannel("inputs", { ordered:true });

pc.addTransceiver("video", { direction:"recvonly" });
pc.addTransceiver("audio", { direction:"recvonly" });

pc.ontrack = (event) => {
    if (event.track.kind === "video") {
        if (event.streams && event.streams.length > 0) {
            video.srcObject = event.streams.at(0);
        } else {
            const stream = new MediaStream();
            stream.addTrack(event.track);
            video.srcObject = stream;
        }
    }
    if (event.track.kind === "audio") {
        const audioStream = new MediaStream();
        audioStream.addTrack(event.track);
        audio.srcObject = audioStream;
        audio.muted = false;
        audio.volume = 1.0;
        audio.play().catch(e => console.log("Audio waiting for touch event:", e));
    }
};

// Fullscreen Request API Integration
fullscreenBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
        container.requestFullscreen().catch(err => {
            console.log("Error enabling fullscreen:", err);
        });
        fullscreenBtn.innerText = "Exit Fullscreen";
    } else {
        document.exitFullscreen();
        fullscreenBtn.innerText = "Go Fullscreen";
    }
});

function sendInput(payload) {
    if (dataChannel && dataChannel.readyState === "open") {
        dataChannel.send(JSON.stringify(payload));
    }
}

// Trackpad Mode Gestures Execution Engine
// Trackpad Mode Gestures Execution Engine
let activeMode = "none";
let lastTouchX = 0;
let lastTouchY = 0;
let initialTouchY2 = 0;

let touchStartTime = 0;
let hasMovedSignificantly = false;
const TAP_TIMEOUT = 200; // Dropped to 200ms for fast click recognition
const MOVE_THRESHOLD = 4; // Dropped to 4px to register tiny adjustments accurately
const SENSITIVITY = 1.5;  // Trackpad acceleration speed modifier

video.addEventListener("touchstart", (e) => {
    e.preventDefault();
    
    if (audio.srcObject) {
        audio.muted = false;
        audio.play().catch(() => {});
    }

    const count = e.touches.length;
    touchStartTime = performance.now();
    hasMovedSignificantly = false;

    if (count === 1) {
        activeMode = "trackpad";
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    } 
    else if (count === 2) {
        activeMode = "scroll2";
        initialTouchY2 = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    }
}, { passive: false });

video.addEventListener("touchmove", (e) => {
    e.preventDefault();

    if (activeMode === "trackpad" && e.touches.length === 1) {
        // Apply sensitivity scaling factors directly to relative movement offsets
        const dx = (e.touches[0].clientX - lastTouchX) * SENSITIVITY;
        const dy = (e.touches[0].clientY - lastTouchY) * SENSITIVITY;

        if (Math.abs(dx) > MOVE_THRESHOLD || Math.abs(dy) > MOVE_THRESHOLD) {
            hasMovedSignificantly = true;
        }

        if (dx !== 0 || dy !== 0) {
            sendInput({ type: "mousemove", dx: Math.round(dx), dy: Math.round(dy) });
        }

        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    } 
    else if (activeMode === "scroll2" && e.touches.length >= 2) {
        const currentY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        const deltaY = currentY - initialTouchY2;
        
        if (Math.abs(deltaY) > 15) { // Dropped threshold to trigger scrolling with less drag effort
            const steps = deltaY > 0 ? -1 : 1; 
            sendInput({ type: "scroll", steps: steps });
            initialTouchY2 = currentY; 
        }
    }
}, { passive: false });

video.addEventListener("touchend", (e) => {
    e.preventDefault();
    const touchDuration = performance.now() - touchStartTime;

    if (activeMode === "trackpad") {
        // If the finger stayed in place, register the left click instantly
        if (!hasMovedSignificantly && touchDuration < TAP_TIMEOUT) {
            sendInput({ type: "mousestart", button: 0 });
            setTimeout(() => sendInput({ type: "mouseend", button: 0 }), 5);
        }
    } 
    else if (activeMode === "scroll2") {
        if (touchDuration < TAP_TIMEOUT) {
            sendInput({ type: "mousestart", button: 1 });
            setTimeout(() => sendInput({ type: "mouseend", button: 1 }), 5);
        }
    }

    // Adaptively down-rank state maps when dropping fingers
    if (e.touches.length === 0) {
        activeMode = "none";
    } else if (e.touches.length === 1) {
        activeMode = "trackpad";
        lastTouchX = e.touches[0].clientX;
        lastTouchY = e.touches[0].clientY;
    }
}, { passive: false });


// Control Panel Button Listeners
document.querySelectorAll(".game-btn[data-key]").forEach(btn => {
    btn.addEventListener("touchstart", (e) => {
        e.preventDefault();
        e.stopPropagation(); 
        
        if (audio.srcObject) audio.play().catch(() => {});

        sendInput({ type: "btnstart", key: btn.getAttribute("data-key") });
    });
    btn.addEventListener("touchend", (e) => {
        e.preventDefault();
        e.stopPropagation();
        sendInput({ type: "btnend", key: btn.getAttribute("data-key") });
    });
});

// Focus Mobile keyboard
kbToggleBtn.addEventListener("touchstart", (e) => {
    e.preventDefault();
    e.stopPropagation();
    keyboardInput.focus();
});

keyboardInput.addEventListener("input", (e) => {
    if (e.data) {
        sendInput({ type: "keyboard", text: e.data });
    } else if (e.inputType === "deleteContentBackward") {
        sendInput({ type: "keyboard", text: "backspace" });
    }
    keyboardInput.value = ""; 
});

async function start() {
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    const response = await fetch("/offer", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sdp: pc.localDescription.sdp, type: pc.localDescription.type })
    });

    const answer = await response.json();
    await pc.setRemoteDescription(new RTCSessionDescription(answer));
}

start();
</script>
</body>
</html>
